URL=${URL}
browser=${browser}
#Username and password to connect to the website.
username=${USERNAME}
password=${PASSWORD}
waitTime=20
#Device udid for Appium
Udid=${Udid}
#Android app package and activity
App_package=com.heirloom.heirloom_poc
App_activity=com.heirloommobile.MainActivity
#iOS bundle id
Bundle_id=com.heirloom.heirloom_poc
Appium_server=http://localhost:4723/wd/hub
#Local adb executable, used to read the installed app's build number and to scroll
Adb_path=${Adb_path}